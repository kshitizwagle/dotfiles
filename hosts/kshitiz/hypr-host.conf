# Host: kshitiz — RX 9070 (0000:03:00.0) + Raphael iGPU (0000:13:00.0)
# MSI G244F E2 + HKC 24E3. Both at 165 Hz: mismatched rates caused VRAM-clock flicker.
monitor = DP-1, 1920x1080@165, 0x0, 1
monitor = DP-2, 1920x1080@165, 1920x0, 1
monitor = , preferred, auto, 1

# Like macOS: every display always keeps one desktop, even when empty (1 on the MSI, 2 on the HKC).
# Other workspaces are created on demand (Super+Shift+D, green button) and vanish once empty.
workspace = 1, monitor:DP-1, persistent:true, default:true
workspace = 2, monitor:DP-2, persistent:true, default:true

# dGPU first. AQ_DRM_DEVICES is ":"-separated and by-path names contain ":",
# so install.sh creates colon-free symlinks ~/.config/hypr/{dgpu,igpu}.
env = AQ_DRM_DEVICES,__HOME__/.config/hypr/dgpu:__HOME__/.config/hypr/igpu
