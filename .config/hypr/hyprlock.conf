# Aura lock screen: one card in the panel's style (#15141b surface, 1px #2e2c3a border, 18px radius,
# BlexMono, #a277ff accent) over the blurred, dimmed desktop wallpaper — the same look as the open
# sidebar. Clock + English/Nepali (BS) date, avatar + name (read from the account, not hard-coded),
# password field that turns purple while checking and red on failure.

general {
    hide_cursor = true
    grace = 0
}

# locking happens a few times a day: a short fade in, a faster fade out
animations {
    enabled = true
    bezier = out, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 2.5, out
    animation = fadeOut, 1, 1.5, out
    animation = inputFieldDots, 1, 1.5, out
    animation = inputFieldColors, 1, 1.5, out
}

background {
    monitor =
    path = ~/Pictures/wallpapers/aura-space-1.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.15
}

# ---- card ----
shape {
    monitor =
    size = 440, 520
    rounding = 18
    color = rgba(15141bf0)
    border_size = 1
    border_color = rgb(2e2c3a)
    position = 0, 0
    halign = center
    valign = center
}

# time
label {
    monitor =
    text = $TIME
    color = rgb(edecee)
    font_size = 64
    font_family = BlexMono Nerd Font SemiBold
    position = 0, 170
    halign = center
    valign = center
}

# date: English (purple) · weekday (bold mint) · Nepali BS (purple) — same as the top bar
label {
    monitor =
    text = cmd[update:60000] echo "<span color='##a277ff'>$(date '+%-d %B')</span>  <span color='##6d6d6d'>·</span>  <span color='##61ffca' weight='bold'>$(date '+%A')</span>  <span color='##6d6d6d'>·</span>  <span color='##a277ff'>$(~/.local/bin/aura-bar bsdate)</span>"
    color = rgb(908f98)
    font_size = 13
    font_family = BlexMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
}

# divider
shape {
    monitor =
    size = 360, 1
    color = rgb(2e2c3a)
    position = 0, 70
    halign = center
    valign = center
}

# avatar: Aura purple circle with the account's initial (like the panel profile)
shape {
    monitor =
    size = 84, 84
    rounding = -1
    color = rgb(a277ff)
    position = 0, 5
    halign = center
    valign = center
}

label {
    monitor =
    # only when there's no ~/.face picture (hyprlock draws labels above images, so it would cover the face)
    text = cmd[update:60000] [ -f ~/.face ] || getent passwd "$USER" | cut -d: -f5 | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = rgb(15141b)
    font_size = 32
    font_family = BlexMono Nerd Font Bold
    position = 0, 5
    halign = center
    valign = center
}

# picture avatar from ~/.face (set-avatar.sh); drawn over the initial, which shows if it's missing
image {
    monitor =
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 2
    border_color = rgb(a277ff)
    position = 0, 5
    halign = center
    valign = center
}

# name
label {
    monitor =
    text = cmd[update:3600000] getent passwd "$USER" | cut -d: -f5 | cut -d, -f1
    color = rgb(a277ff)
    font_size = 16
    font_family = BlexMono Nerd Font Bold
    position = 0, -62
    halign = center
    valign = center
}

# password
input-field {
    monitor =
    size = 340, 44
    rounding = 10
    outline_thickness = 1
    outer_color = rgb(3d375e)
    inner_color = rgb(2e2c3a)
    font_color = rgb(edecee)
    font_family = BlexMono Nerd Font
    check_color = rgb(a277ff)
    fail_color = rgb(ff6767)
    fail_text = <span color='##ff6767'>Incorrect password</span>
    capslock_color = rgb(ffca85)
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span color='##908f98'>Password</span>
    hide_input = false
    position = 0, -130
    halign = center
    valign = center
}

# hint
label {
    monitor =
    text = <span color='##6d6d6d'>Enter to unlock</span>
    color = rgb(6d6d6d)
    font_size = 11
    font_family = BlexMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
}
