# Apple-style lock screen with "liquid glass" controls.
# Sharp wallpaper; big BlexMono Nerd Font clock (SF Pro stand-in) with tight tracking; date above it
# (English + Nepali BS date — the only Nepali here); macOS-style avatar + glass password pill at the bottom.

general {
    hide_cursor = true
    grace = 0
}

# Lock happens a few times a day -> a short, quiet fade is fine; exit faster than enter
animations {
    enabled = true
    bezier = out, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 2.5, out
    animation = fadeOut, 1, 1.5, out
    animation = inputFieldDots, 1, 1.5, out
    animation = inputFieldColors, 1, 1.5, out
}

background {
    monitor =
    path = ~/Pictures/wallpapers/aura-space-2.png
    blur_passes = 0
    brightness = 0.78
    contrast = 1.05
    vibrancy = 0.2
}

# -- date: Thursday, 15 October  ·  २९ असोज २०८३ --
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='512'>$(~/.local/bin/aura-bar lockdate)</span>"
    color = rgba(ffffffe6)
    font_size = 21
    font_family = BlexMono Nerd Font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000059)
    position = 0, 330
    halign = center
    valign = center
}

# -- time: heavy, tightly tracked, translucent white so the wallpaper glows through like glass --
label {
    monitor =
    text = cmd[update:1000] echo "<span letter_spacing='-6144'>$TIME</span>"
    color = rgba(ffffffcc)
    font_size = 160
    font_family = BlexMono Nerd Font
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0000004d)
    position = 0, 205
    halign = center
    valign = center
}

# -- avatar: frosted glass circle with a bright rim --
shape {
    monitor =
    size = 96, 96
    rounding = -1
    color = rgba(ffffff26)
    border_size = 1
    border_color = rgba(ffffff8c) rgba(ffffff1a) 135deg
    position = 0, -205
    halign = center
    valign = center
}

label {
    monitor =
    text = K
    color = rgba(ffffffee)
    font_size = 36
    font_family = BlexMono Nerd Font
    position = 0, -205
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] getent passwd "$USER" | cut -d: -f5 | cut -d, -f1
    color = rgba(ffffffee)
    font_size = 15
    font_family = BlexMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000059)
    position = 0, -280
    halign = center
    valign = center
}

# -- password: liquid-glass pill (translucent fill + light-catching top edge) --
input-field {
    monitor =
    size = 260, 40
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(ffffff8c) rgba(ffffff1a) 90deg
    inner_color = rgba(ffffff1f)
    font_color = rgba(ffffffee)
    font_family = BlexMono Nerd Font
    check_color = rgba(ffffff59) rgba(ffffff1a) 90deg
    fail_color = rgba(ff6767b3) rgba(ff676733) 90deg
    fail_text = <span font_family='BlexMono Nerd Font'>Incorrect password</span>
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground='##ffffffa6' font_family='BlexMono Nerd Font'>Enter Password</span>
    hide_input = false
    position = 0, -335
    halign = center
    valign = center
}

label {
    monitor =
    text = Type your password to unlock
    color = rgba(ffffff80)
    font_size = 11
    font_family = BlexMono Nerd Font
    position = 0, -380
    halign = center
    valign = center
}
