# Aura Dark — Hyprland (Ubuntu 26.04, hyprland 0.53.3)

# Machine-specific: monitors + GPU order. install.sh links hosts/<hostname>/hypr-host.conf here (not in .config)
source = ~/.config/hypr/host.conf
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

$terminal = ghostty
$launcher = fuzzel

general {
    border_size = 1
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgb(51a192)
    col.inactive_border = rgb(24383d)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}

# Durations are in deciseconds: 1.6 = 160ms, 4.2 = 420ms
animations {
    enabled = true
    # Motion follows docs/aura-tokens.md + Emil Kowalski's rules: ease-out for anything entering or
    # responding, ease-in-out only for on-screen movement, exits faster than entrances, nothing
    # over ~220 ms, and keyboard-spammed actions (workspaces) kept short.
    bezier = auraOut, 0.23, 1, 0.32, 1        # strong ease-out
    bezier = auraInOut, 0.77, 0, 0.175, 1     # on-screen movement
    bezier = auraDrawer, 0.32, 0.72, 0, 1     # sheets / notifications (iOS drawer curve)
    animation = windowsIn, 1, 1.6, auraOut, popin 96%
    animation = windowsOut, 1, 1.1, auraOut, popin 96%
    animation = windowsMove, 1, 2.2, auraInOut
    animation = border, 1, 1.6, auraOut
    animation = fadeIn, 1, 1.6, auraOut
    animation = fadeOut, 1, 1.1, auraOut
    animation = fadeSwitch, 1, 1.6, auraOut
    animation = fadeLayersIn, 1, 1.8, auraOut
    animation = fadeLayersOut, 1, 1.1, auraOut
    animation = layersIn, 1, 1.8, auraDrawer, fade
    animation = layersOut, 1, 1.1, auraOut, fade
    animation = workspaces, 1, 1.8, auraOut, slidefade 12%
    animation = specialWorkspace, 1, 1.6, auraOut, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    focus_on_activate = true  # an app asking for focus (link opened, launcher) brings you to its workspace
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0f0e14)
    vrr = 0
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

source = ~/.config/hypr/rules.conf

# Starts graphical-session.target (portals, waybar, swaync, hyprpaper, hypridle, polkit).
# Without it xdg-desktop-portal-hyprland never runs and every app waits ~25s on startup.
exec-once = ~/.config/hypr/scripts/session.sh start
# nm-applet removed: network lives in the Control Center (top-right)
# blueman-applet removed: Bluetooth lives in the Control Center (top-right)
# Tear it down on exit, or GNOME refuses the next login ("graphical session already running")
exec-shutdown = ~/.config/hypr/scripts/session.sh stop
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# vicinae runs as a systemd user service (vicinae.service); no exec-once needed

$mod = SUPER
bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $launcher
bind = ALT, Space, exec, vicinae toggle
bind = $mod, Q, exec, ~/.config/hypr/scripts/close.sh
bind = $mod SHIFT, E, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, loginctl lock-session
bind = $mod, N, exec, ~/.config/hypr/aura-panel/toggle.sh  # notifications live in the side panel
bind = $mod ALT, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = CTRL SHIFT, M, exec, ~/.config/hypr/scripts/show-desktop.sh  # hide/show all windows on this screen
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%F_%H%M%S).png
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, D, exec, ~/.config/hypr/scripts/workspace.sh new  # new workspace on this monitor
bind = $mod SHIFT, left, exec, ~/.config/hypr/scripts/workspace.sh prev   # previous workspace on this monitor
bind = $mod SHIFT, right, exec, ~/.config/hypr/scripts/workspace.sh next  # next workspace on this monitor
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mod, Escape, exec, ~/.config/hypr/scripts/powermenu.sh
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Titlebar buttons (hyprbars plugin)
exec-once = hyprctl plugin load ~/.local/lib/hyprland/libhyprbars.so && hyprctl reload
source = ~/.config/hypr/hyprbars.conf
bind = $mod SHIFT, M, exec, ~/.config/hypr/scripts/unminimize.sh  # restore last minimized window here

# Don't warp the mouse to the center of windows focused from the dock/keybinds
cursor {
    enable_hyprcursor = false
    no_warps = true
}

# Home-screen dashboard panel
exec-once = ~/.config/hypr/aura-panel/run.sh
bind = $mod, D, exec, ~/.config/hypr/aura-panel/toggle.sh
