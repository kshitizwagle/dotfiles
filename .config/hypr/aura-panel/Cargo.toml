[package]
name = "aura-panel"
version = "0.1.0"
edition = "2021"
description = "Hyprland home-screen dashboard + controls sidebar (GTK4 + layer-shell), Aura theme"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde_json = "1"
async-channel = "2"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
