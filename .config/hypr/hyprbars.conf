# macOS-style titlebar buttons (requires: hyprpm add https://github.com/hyprwm/hyprland-plugins && hyprpm enable hyprbars)
plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgb(15141b)
        col.text = rgb(edecee)
        bar_text_size = 11
        bar_text_align = center
        bar_buttons_alignment = right
        bar_part_of_window = true
        bar_precedence_over_border = true

        # declared outermost-first (rightmost first): close, minimize, maximize
        hyprbars-button = rgb(ff5f57), 13, , ~/.config/hypr/scripts/close.sh bar
        hyprbars-button = rgb(febc2e), 13, , ~/.config/hypr/scripts/minimize.sh
        hyprbars-button = rgb(28c840), 13, , ~/.config/hypr/scripts/fullscreen.sh  # own workspace, macOS-style
    }
}

