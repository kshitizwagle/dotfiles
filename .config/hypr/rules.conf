# Blur only on bar + notifications (spec: no window blur).
# Hyprland 0.53 block syntax (matches /usr/share/hypr/hyprland.conf)
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
}
layerrule {
    name = blur-swaync-cc
    match:namespace = swaync-control-center
    blur = true
}
layerrule {
    name = blur-swaync-notif
    match:namespace = swaync-notification-window
    blur = true
}
layerrule {
    name = blur-dock
    match:namespace = waybar
    blur = true
}

# Floating utility windows (Wi-Fi picker, mixer, network/bluetooth settings)
windowrule {
    name = float-utilities
    match:class = ^(aura\.float|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager)$
    float = true
    size = 900 600
    center = true
}

# Home-screen dashboard: blur whatever is behind its dimmed backdrop (only while raised; transparent pixels are skipped)
layerrule {
    name = blur-dashboard
    match:namespace = dashboard
    blur = true
    ignore_alpha = 0.05
    no_anim = true
}

# Control Center popover: blur behind its glass panel only (the transparent click-catcher is skipped)
layerrule {
    name = blur-controlcenter
    match:namespace = controlcenter
    blur = true
    ignore_alpha = 0.3
    no_anim = true
}

# Controls sidebar (Super+D) and its other-monitor click-catchers: blur everything behind
# their dimmed backdrops while open
layerrule {
    name = blur-dashboard-controls
    match:namespace = ^(dashboard-controls|dashboard-catcher)$
    blur = true
    ignore_alpha = 0.05
    no_anim = true
}

# Ignore apps asking to maximize themselves (Spotify does it on restore/track changes).
# Straight from Hyprland 0.53's reference config; the green titlebar button uses fullscreen, unaffected.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# ---- motion per layer (see the animations block in hyprland.conf) ----
# Notifications slide in from the right edge and leave the same way (spatial consistency).
layerrule {
    name = anim-notifications
    match:namespace = notifications
    animation = slide right
}
# Power menu: rare, deliberate → a small pop-in is fine.
layerrule {
    name = anim-logout
    match:namespace = logout_dialog
    animation = popin 94%
}
# Launcher: opened from the keyboard many times a day → no animation (the Raycast rule).
layerrule {
    name = anim-vicinae
    match:namespace = vicinae
    no_anim = true
}

# Spotify asks to be activated on play/pause/next; with focus_on_activate that yanked it out of the
# tray and onto the screen whenever the home-screen player was used. Ignore its activation requests.
windowrule {
    name = spotify-no-activate
    match:class = ^(Spotify|spotify)$
    suppress_event = activate activatefocus
}
