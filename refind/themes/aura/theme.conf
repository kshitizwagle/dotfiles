# Aura Dark boot menu, from the "Boot Menu – Aura Dark" design canvas.
# rEFInd draws the selection tile at 9/8 of big_icon_size and 4/3 of small_icon_size:
# 178 -> 200px OS tiles, 48 -> 64px tool tiles. Header, "Choose a system" and key hints are baked into background.png.

# Aura Dark — rEFInd theme (tokens from the Aura Dark design system)
# bg #15141b · accent #a277ff · accent-tint #3d375e · fg #edecee · muted #bdbdbd · IBM Plex Mono
# No motion: a boot menu is keyboard-driven and seen daily; selection changes are instant.

icons_dir themes/aura/icons
banner themes/aura/background.png
banner_scale fillscreen
selection_big themes/aura/selection_big.png
selection_small themes/aura/selection_small.png
font themes/aura/font.png

resolution 1920 1080
big_icon_size 178
small_icon_size 48

hideui hints,arrows,badges,label
# rEFInd 0.14.2 overwrites the first N slots of its 12-slot default tool list
# without clearing the rest, so a short list leaves defaults behind and
# shutdown/reboot/firmware showed twice. Fill all 12: wanted tools first, then
# tools that don't exist on this machine (they render nothing).
# hidden_tags only appears if you hide an entry (Del/- on the boot screen).
showtools shutdown,reboot,firmware,mok_tool,about,shell,memtest,gdisk,apple_recovery,windows_recovery,fwupdate,hidden_tags

# One Ubuntu entry: boot the kernel directly (options from /boot/refind_linux.conf),
# hide the GRUB loader and the fallback shim. GRUB stays reachable from the firmware boot menu.
dont_scan_dirs EFI/ubuntu,EFI/BOOT
fold_linux_kernels true
